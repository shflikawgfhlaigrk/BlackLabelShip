# Black Label Sovereign — Developer-ID lane (built_app_path re-verified 2026-07-10:
# build-developer-id.sh writes to ./build/developer-id since commit 3d8dc92 "Guard
# canonical production installs" — the old /tmp/bls-devid path shipped a stale build.)
repo = "~/BlackLabelSovereign"
bundle_id = "com.blacklabel.sovereign"
app_name = "Black Label Sovereign.app"
build_cmd = "./build-developer-id.sh"
built_app_path = "build/developer-id/Black Label Sovereign.app"
arch = "universal2"
required_entitlements = ["com.apple.security.personal-information.calendars"]
forbidden_entitlements = ["com.apple.security.app-sandbox"]
ships_no_data_globs = ["*.sqlite", "*.db", "*.csv", "*.pem", "*.key", "*.tokens", "*secrets*", "*.jsonl", "leads*", "bars*"]
r2_dl_key = "sovereign.zip"
r2_updates_key = "updates/sovereign/{build}.zip"
manifest_endpoint = "/api/version/sovereign"
dl_url = "https://blacklabelbots.com/dl/sovereign.zip?k=c76acb879e8fe0d8d69a9b081e01758d"
ports = []
test_cmd = "bash Tests/run.command"
entitlements_file = "Sources/app-devid.entitlements"
