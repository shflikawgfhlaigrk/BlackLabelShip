# Black Label Trading — Developer-ID lane (values verified against repo 2026-07-01)
# Spawns a bundled universal2 CPython data backend (vendor/python-runtime), Hardened Runtime, no sandbox.
repo = "~/BlackLabelTrading"
bundle_id = "com.blacklabel.trading"
app_name = "Black Label Trading.app"
build_cmd = "./build-developer-id.sh"
built_app_path = "build/Black Label Trading.app"
arch = "universal2"
# allow-dyld-environment-variables is FORBIDDEN, not required: it governs DYLD_* only, and the
# backend launcher passes PYTHONPATH (never stripped by the hardened runtime) and sets no DYLD_*
# variable. Granted alongside disable-library-validation on this non-sandboxed Developer-ID app it
# would re-enable DYLD_INSERT_LIBRARIES injection of unsigned dylibs. Sources/app-developerid.entitlements
# withholds it; listing it as required made gate_entitlements demand the vulnerability back.
required_entitlements = ["com.apple.security.cs.disable-library-validation", "com.apple.security.network.client"]
forbidden_entitlements = ["com.apple.security.app-sandbox", "com.apple.security.cs.allow-dyld-environment-variables"]
ships_no_data_globs = ["*.sqlite", "*.sqlite3", "*.db", "*.csv", "*.pem", "*.key", "*.tokens", "*secrets*", "bars*", "ledger*", "*.env"]
r2_dl_key = "trading.zip"
r2_updates_key = "updates/trading/{build}.zip"
manifest_endpoint = "/api/version/trading"
dl_url = "https://blacklabelbots.com/dl/trading.zip?k=c76acb879e8fe0d8d69a9b081e01758d"
ports = ["8787"]
test_cmd = "bash Tests/run-all.sh"
entitlements_file = "Sources/app-developerid.entitlements"
