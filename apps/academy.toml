# Black Label Academy — Developer-ID lane (values verified against repo 2026-07-01)
# Native Swift, universal2 (lipo arm64+x86_64), hardened runtime, non-sandbox. NO bundled runtime.
# NOTE: the app bundles Contents/Resources/BlackLabelAcademy.sqlite = the CURRICULUM (the product
# itself, authored read-only content — 234 entries). That is the deliverable, not user/customer
# data, so *.sqlite is intentionally NOT in ships_no_data_globs; secrets + real data still blocked.
repo = "~/BlackLabelAcademy"
bundle_id = "com.blacklabel.academy"
app_name = "Black Label Academy.app"
build_cmd = "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer SIGN_ID=05494FC15FB97F422400BC32DF6D67FC2D28855B ./build.sh"
built_app_path = ".build-stage/Black Label Academy.app"
arch = "universal2"
required_entitlements = []
forbidden_entitlements = ["com.apple.security.app-sandbox"]
ships_no_data_globs = ["*.pem", "*.key", "*.tokens", "*secrets*", "*.env", "leads*", "users*", "*.csv"]
r2_dl_key = "academy.zip"
r2_updates_key = "updates/academy/{build}.zip"
manifest_endpoint = "/api/version/academy"
dl_url = "https://blacklabelbots.com/dl/academy.zip?k=c76acb879e8fe0d8d69a9b081e01758d"
ports = []
# Two legs, both fail-closed. Python was pinned to system python3 (3.9.6) because the `python3` on
# PATH is Homebrew 3.14, which has no pytest, so the bare command died with "No module named pytest"
# and took the preflight gate down with it. A missing test RUNNER must never read as a failing test
# suite — gate_test_runner now says so in its own words.
#
# The xctest leg exists because pytest here covers the CONTENT pipeline only: every Swift line in the
# app — the reader, the updater, the whole trial/$30-mo entitlement machine in Sources/Trial.swift —
# was shipping with no ship gate over it at all. tests/xctest.sh carries its own zero-test guard, so
# an empty <Testables> reports FAIL instead of the "Executed 0 tests / TEST SUCCEEDED" green.
test_cmd = ["/usr/bin/python3 -m pytest tests/ -q", "bash tests/xctest.sh"]
entitlements_file = ""
