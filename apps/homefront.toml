# Black Label Homefront — Developer-ID lane (values verified against repo 2026-07-01)
# Swift main binary universal2; bundled CPython sensing engine is arm64-only by design
# (python-build-standalone ships no universal2 numpy stack) — disclosed on homefront.html FAQ.
# build.sh signs nested python inside-out (engine-python.entitlements), then the app with
# Homefront.entitlements (mic + camera + local-network — TCC prompts die without them).
repo = "~/BlackLabelHome"
bundle_id = "com.blacklabel.homefront"
app_name = "Vigil.app"
build_cmd = "SIGN_ID=05494FC15FB97F422400BC32DF6D67FC2D28855B ./build.sh"
built_app_path = ".build-stage/Vigil.app"
arch = "universal2"
required_entitlements = ["com.apple.security.device.audio-input", "com.apple.security.device.camera", "com.apple.security.network.client", "com.apple.security.network.server", "com.apple.security.cs.disable-library-validation"]
forbidden_entitlements = ["com.apple.security.app-sandbox"]
ships_no_data_globs = ["*.sqlite", "*.sqlite3", "*.db", "*.csv", "*.pem", "*.key", "*.tokens", "*secrets*", "*.env", "known_nodes*", "alerts*"]
r2_dl_key = "homefront.zip"
r2_updates_key = "updates/homefront/{build}.zip"
manifest_endpoint = "/api/version/homefront"
dl_url = "https://blacklabelbots.com/dl/homefront.zip?k=c76acb879e8fe0d8d69a9b081e01758d"
ports = ["8790", "8799"]
test_cmd = "bash test.sh"
entitlements_file = "Homefront.entitlements"
